name: Temporary LG diagnostics formatter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-format-lg-diagnostics.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.21
      - name: Format diagnostic files
        run: |
          python -m ruff format src/connection_recovery.py src/lg_tcp_connector.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/connection_recovery.py src/lg_tcp_connector.py
          git commit -m 'Format LG TCP TLS diagnostics'
          git push
