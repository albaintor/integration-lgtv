name: Temporary Ruff format diff
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.15.21
      - run: |
          python -m ruff format src/connection_recovery.py
          git diff -- src/connection_recovery.py
          if ! git diff --quiet -- src/connection_recovery.py; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/connection_recovery.py
            git commit -m "Format network diagnostics"
            git push
          fi
