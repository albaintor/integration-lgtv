name: Temporary ThinQ TLS strategy patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-thinq-tls-strategy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch connection strategy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/connection_recovery.py')
          t = p.read_text()
          t = t.replace('import asyncio\nimport logging\nimport time\n', 'import asyncio\nimport errno\nimport logging\nimport ssl\nimport time\n', 1)

          old = '''    async def _ws_connect(self, uri: str, max_msg_size: int) -> ClientWebSocketResponse:\n        \"\"\"Create one WebSocket and log the complete connection stage.\"\"\"\n        started = time.monotonic()\n        _LOG.debug(\n            \"[%s] LG WS connect start: %s timeout=%.1fs heartbeat=%.1fs\",\n            self.host,\n            uri,\n            self.timeout_connect,\n            self.heartbeat,\n        )\n        try:\n            ws = await super()._ws_connect(uri, max_msg_size)\n'''
          new = '''    @staticmethod\n    def _new_ssl_context() -> ssl.SSLContext:\n        \"\"\"Return a fresh unverified TLS context for one LG WSS connection.\n\n        LG ConnectSDK creates a new SSLContext for every connect attempt. aiohttp's\n        ssl=False path reuses a process-global unverified SSLContext, which can keep\n        TLS session state between reconnects. Using a fresh context preserves the\n        same certificate policy while avoiding stale TLS session/resumption state.\n        \"\"\"\n        context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)\n        context.check_hostname = False\n        context.verify_mode = ssl.CERT_NONE\n        context.options |= ssl.OP_NO_COMPRESSION\n        context.set_alpn_protocols((\"http/1.1\",))\n        return context\n\n    async def _ws_connect(self, uri: str, max_msg_size: int) -> ClientWebSocketResponse:\n        \"\"\"Create one WebSocket and log the complete connection stage.\"\"\"\n        started = time.monotonic()\n        _LOG.debug(\n            \"[%s] LG WS connect start: %s timeout=%.1fs heartbeat=%.1fs\",\n            self.host,\n            uri,\n            self.timeout_connect,\n            self.heartbeat,\n        )\n        if self.client_session is None:\n            self._ensure_client_session()\n        assert self.client_session is not None\n\n        request_ssl: ssl.SSLContext | bool = (\n            self._new_ssl_context() if uri.startswith(\"wss://\") else False\n        )\n        try:\n            async with asyncio.timeout(self.timeout_connect):\n                ws = await self.client_session.ws_connect(\n                    uri,\n                    heartbeat=self.heartbeat,\n                    ssl=request_ssl,\n                    max_msg_size=max_msg_size,\n                )\n'''
          if old not in t:
              raise SystemExit('ws_connect marker not found')
          t = t.replace(old, new, 1)

          old = '''    async def _create_main_ws(self) -> ClientWebSocketResponse:\n        \"\"\"Prefer current webOS WSS/3001 and fall back on connection errors.\"\"\"\n        secure_uri = f\"wss://{self.host}:{WSS_PORT}\"\n        try:\n            return await self._ws_connect(secure_uri, MAIN_WS_MAX_MSG_SIZE)\n        except aiohttp.ClientConnectionError as ex:\n            # Keep legacy webOS support when the secure endpoint explicitly\n            # fails at the connection layer. A TimeoutError is intentionally\n            # allowed to propagate: on current TVs it may simply mean WSS/3001\n            # needs longer than aiowebostv's historical 2 second timeout.\n            _LOG.debug(\n                \"[%s] WSS/3001 connection error (%r), trying legacy WS/%s\",\n                self.host,\n                ex,\n                WS_PORT,\n            )\n\n        legacy_uri = f\"ws://{self.host}:{WS_PORT}\"\n        return await self._ws_connect(legacy_uri, MAIN_WS_MAX_MSG_SIZE)\n'''
          new = '''    async def _create_main_ws(self) -> ClientWebSocketResponse:\n        \"\"\"Prefer WSS/3001; use WS/3000 only for an explicit legacy signal.\"\"\"\n        secure_uri = f\"wss://{self.host}:{WSS_PORT}\"\n        try:\n            return await self._ws_connect(secure_uri, MAIN_WS_MAX_MSG_SIZE)\n        except aiohttp.WSServerHandshakeError as ex:\n            _LOG.debug(\n                \"[%s] WSS/3001 websocket handshake rejected (%r), trying legacy WS/%s\",\n                self.host,\n                ex,\n                WS_PORT,\n            )\n        except aiohttp.ClientConnectionError as ex:\n            os_error = getattr(ex, \"os_error\", None)\n            error_number = getattr(os_error, \"errno\", None)\n            if error_number != errno.ECONNREFUSED:\n                raise\n            _LOG.debug(\n                \"[%s] WSS/3001 explicitly refused (ECONNREFUSED), trying legacy WS/%s\",\n                self.host,\n                WS_PORT,\n            )\n\n        legacy_uri = f\"ws://{self.host}:{WS_PORT}\"\n        return await self._ws_connect(legacy_uri, MAIN_WS_MAX_MSG_SIZE)\n'''
          if old not in t:
              raise SystemExit('fallback marker not found')
          t = t.replace(old, new, 1)

          t = t.replace('    - do not fall back to legacy WS/3000 when WSS/3001 merely times out;\n', '    - use a fresh TLS context for every WSS connection, matching ConnectSDK and\n      avoiding TLS session state reuse across Remote standby/resume cycles;\n    - fall back to legacy WS/3000 only on explicit refusal/handshake rejection;\n', 1)
          p.write_text(t)

          p = Path('test/test_connection_recovery_profile.py')
          t = p.read_text()
          t = t.replace('import asyncio\nimport sys\n', 'import asyncio\nimport errno\nimport ssl\nimport sys\n', 1)
          t = t.replace('from unittest.mock import AsyncMock, call\n', 'from unittest.mock import AsyncMock, call\n', 1)

          old = '''    async def test_connection_rejection_falls_back_to_legacy_port(self) -> None:\n        client = GracefulWebOsClient(\"test-tv\")\n        expected_ws = object()\n        client._ws_connect = AsyncMock(\n            side_effect=[aiohttp.ClientConnectionError(\"rejected\"), expected_ws]\n        )\n\n        result = await client._create_main_ws()\n'''
          new = '''    async def test_connection_rejection_falls_back_to_legacy_port(self) -> None:\n        client = GracefulWebOsClient(\"test-tv\")\n        expected_ws = object()\n        refused = aiohttp.ClientConnectionError(\"rejected\")\n        refused.os_error = OSError(errno.ECONNREFUSED, \"Connection refused\")\n        client._ws_connect = AsyncMock(side_effect=[refused, expected_ws])\n\n        result = await client._create_main_ws()\n'''
          if old not in t:
              raise SystemExit('test fallback marker not found')
          t = t.replace(old, new, 1)

          insert_after = '''    async def test_secure_timeout_does_not_fall_back_to_legacy_port(self) -> None:\n        client = GracefulWebOsClient(\"test-tv\")\n        client._ws_connect = AsyncMock(side_effect=asyncio.TimeoutError())\n\n        with self.assertRaises(asyncio.TimeoutError):\n            await client._create_main_ws()\n\n        client._ws_connect.assert_awaited_once_with(\n            \"wss://test-tv:3001\", MAIN_WS_MAX_MSG_SIZE\n        )\n\n'''
          addition = '''    async def test_host_unreachable_does_not_fall_back_to_legacy_port(self) -> None:\n        client = GracefulWebOsClient(\"test-tv\")\n        unreachable = aiohttp.ClientConnectionError(\"unreachable\")\n        unreachable.os_error = OSError(errno.EHOSTUNREACH, \"No route to host\")\n        client._ws_connect = AsyncMock(side_effect=unreachable)\n\n        with self.assertRaises(aiohttp.ClientConnectionError):\n            await client._create_main_ws()\n\n        client._ws_connect.assert_awaited_once_with(\n            \"wss://test-tv:3001\", MAIN_WS_MAX_MSG_SIZE\n        )\n\n    async def test_tls_context_is_fresh_for_each_connection(self) -> None:\n        first = GracefulWebOsClient._new_ssl_context()\n        second = GracefulWebOsClient._new_ssl_context()\n\n        self.assertIsNot(first, second)\n        self.assertFalse(first.check_hostname)\n        self.assertEqual(first.verify_mode, ssl.CERT_NONE)\n        self.assertFalse(second.check_hostname)\n        self.assertEqual(second.verify_mode, ssl.CERT_NONE)\n\n'''
          if insert_after not in t:
              raise SystemExit('test insert marker not found')
          t = t.replace(insert_after, insert_after + addition, 1)
          p.write_text(t)
          PY

          python -m ruff format src/connection_recovery.py test/test_connection_recovery_profile.py || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-thinq-tls-strategy.yml
          git add src/connection_recovery.py test/test_connection_recovery_profile.py
          git commit -m 'Use fresh TLS context and restrict legacy fallback'
          git push
