name: Temporary fast network recovery

on:
  push:
    paths:
      - '.github/workflows/tmp-fast-network-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Apply fast network recovery fix
        run: python .github/scripts/tmp_fast_network_recovery.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
      - name: Format and validate
        run: |
          python -m ruff format src test/test_connection_recovery_profile.py
          python -m ruff check src test/test_connection_recovery_profile.py
          python -m pyright src
          python -m pytest -q test/test_connection_recovery_profile.py
      - name: Commit fix and remove temporary files
        run: |
          rm .github/scripts/tmp_fast_network_recovery.py
          rm .github/workflows/tmp-fast-network-recovery.yml
          git config user.name 'albaintor'
          git config user.email '118518828+albaintor@users.noreply.github.com'
          git add -A
          git commit -m 'Probe network path before LG reconnect'
          git push origin HEAD:main
